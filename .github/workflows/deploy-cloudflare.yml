name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - '**'  # 所有分支 push 都觸發部署
  pull_request:
    branches:
      - '**'  # 所有 PR 都觸發部署

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy to Cloudflare Workers

    # 設定環境名稱（用於 Cloudflare Workers 環境區分）
    environment:
      name: ${{ github.ref_name }}
      url: https://quotation-system-${{ github.ref_name }}.acejou27.workers.dev

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Build project with OpenNext
        run: |
          # 先執行 Next.js 建置
          pnpm run build
          # 再執行 OpenNext 轉換為 Cloudflare Workers 格式
          pnpm exec opennextjs-cloudflare build
        env:
          # Supabase 環境變數（建置時需要）
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_POOLER_URL: ${{ secrets.SUPABASE_POOLER_URL }}
          ZEABUR_POSTGRES_URL: ${{ secrets.ZEABUR_POSTGRES_URL }}
          # 其他建置時可能需要的環境變數
          NODE_ENV: production
          COMPANY_NAME: ${{ secrets.COMPANY_NAME || '振禾有限公司' }}

      - name: Set deployment name
        id: deployment-name
        run: |
          # 將分支名稱轉換為合法的 worker 名稱（移除特殊字元）
          BRANCH_NAME=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9-]/-/g' | tr '[:upper:]' '[:lower:]')
          if [ "$BRANCH_NAME" = "main" ]; then
            echo "WORKER_NAME=quotation-system" >> $GITHUB_OUTPUT
          else
            echo "WORKER_NAME=quotation-system-$BRANCH_NAME" >> $GITHUB_OUTPUT
          fi
          echo "Deploying to: $(cat $GITHUB_OUTPUT | grep WORKER_NAME)"

      - name: Deploy to Cloudflare Workers
        run: |
          # 部署前設置所有 secrets
          echo "Setting Cloudflare Workers secrets..."

          # 設置 Supabase secrets
          echo "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" | pnpm exec wrangler secret put NEXT_PUBLIC_SUPABASE_URL --name ${{ steps.deployment-name.outputs.WORKER_NAME }}
          echo "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" | pnpm exec wrangler secret put NEXT_PUBLIC_SUPABASE_ANON_KEY --name ${{ steps.deployment-name.outputs.WORKER_NAME }}
          echo "${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" | pnpm exec wrangler secret put SUPABASE_SERVICE_ROLE_KEY --name ${{ steps.deployment-name.outputs.WORKER_NAME }}
          echo "${{ secrets.SUPABASE_POOLER_URL }}" | pnpm exec wrangler secret put SUPABASE_POOLER_URL --name ${{ steps.deployment-name.outputs.WORKER_NAME }}

          # 設置資料庫 URL
          echo "${{ secrets.ZEABUR_POSTGRES_URL }}" | pnpm exec wrangler secret put ZEABUR_POSTGRES_URL --name ${{ steps.deployment-name.outputs.WORKER_NAME }}

          # 設置 API Keys
          echo "${{ secrets.EXCHANGE_RATE_API_KEY }}" | pnpm exec wrangler secret put EXCHANGE_RATE_API_KEY --name ${{ steps.deployment-name.outputs.WORKER_NAME }}
          echo "${{ secrets.CSRF_SECRET }}" | pnpm exec wrangler secret put CSRF_SECRET --name ${{ steps.deployment-name.outputs.WORKER_NAME }}
          echo "${{ secrets.CRON_SECRET }}" | pnpm exec wrangler secret put CRON_SECRET --name ${{ steps.deployment-name.outputs.WORKER_NAME }}
          echo "${{ secrets.ADMIN_API_KEY }}" | pnpm exec wrangler secret put ADMIN_API_KEY --name ${{ steps.deployment-name.outputs.WORKER_NAME }}

          # 設置 Email secrets (如果存在)
          if [ -n "${{ secrets.GMAIL_USER }}" ]; then
            echo "${{ secrets.GMAIL_USER }}" | pnpm exec wrangler secret put GMAIL_USER --name ${{ steps.deployment-name.outputs.WORKER_NAME }}
            echo "${{ secrets.GMAIL_APP_PASSWORD }}" | pnpm exec wrangler secret put GMAIL_APP_PASSWORD --name ${{ steps.deployment-name.outputs.WORKER_NAME }}
          fi

          if [ -n "${{ secrets.RESEND_API_KEY }}" ]; then
            echo "${{ secrets.RESEND_API_KEY }}" | pnpm exec wrangler secret put RESEND_API_KEY --name ${{ steps.deployment-name.outputs.WORKER_NAME }}
          fi

          # 設置可選的 Webhook URLs
          if [ -n "${{ secrets.ERROR_WEBHOOK_URL }}" ]; then
            echo "${{ secrets.ERROR_WEBHOOK_URL }}" | pnpm exec wrangler secret put ERROR_WEBHOOK_URL --name ${{ steps.deployment-name.outputs.WORKER_NAME }}
          fi

          if [ -n "${{ secrets.SUCCESS_WEBHOOK_URL }}" ]; then
            echo "${{ secrets.SUCCESS_WEBHOOK_URL }}" | pnpm exec wrangler secret put SUCCESS_WEBHOOK_URL --name ${{ steps.deployment-name.outputs.WORKER_NAME }}
          fi

          # 使用動態 worker 名稱部署主 Worker
          pnpm exec wrangler deploy --name ${{ steps.deployment-name.outputs.WORKER_NAME }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f9916b95d011e8ad2a3fe10883053b0f

      - name: Deploy Tail Worker (Monitoring)
        run: |
          # 部署 Tail Worker 進行日誌監控
          echo "Deploying Tail Worker for monitoring..."

          # 設置 Tail Worker secrets
          if [ -n "${{ secrets.ERROR_WEBHOOK_URL }}" ]; then
            echo "${{ secrets.ERROR_WEBHOOK_URL }}" | pnpm exec wrangler secret put ERROR_WEBHOOK_URL --config wrangler.tail.jsonc
          fi

          if [ -n "${{ secrets.SUCCESS_WEBHOOK_URL }}" ]; then
            echo "${{ secrets.SUCCESS_WEBHOOK_URL }}" | pnpm exec wrangler secret put SUCCESS_WEBHOOK_URL --config wrangler.tail.jsonc
          fi

          if [ -n "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "${{ secrets.SLACK_WEBHOOK_URL }}" | pnpm exec wrangler secret put SLACK_WEBHOOK_URL --config wrangler.tail.jsonc
          fi

          # 部署 Tail Worker
          pnpm exec wrangler deploy --config wrangler.tail.jsonc

          echo "✅ Tail Worker deployed successfully"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: f9916b95d011e8ad2a3fe10883053b0f

      - name: Comment PR with deployment URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 部署完成！\n\n預覽網址：https://${{ steps.deployment-name.outputs.WORKER_NAME }}.acejou27.workers.dev`
            })
